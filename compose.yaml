services:
  lab:
    build:
      context: .
    image: catfish-lab:local
    working_dir: /workspace
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    volumes:
      - .:/workspace
    environment:
      TERM: xterm-256color
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
  docs:
    build:
      context: .
    image: catfish-lab:local
    working_dir: /workspace
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    command: ["docs", "--host", "0.0.0.0", "--port", "8000"]
