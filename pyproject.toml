[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "catfish-lab"
version = "0.5.0"
description = "Evidence-driven, one-model multi-role development harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "pyyaml>=6.0.2,<7",
  "textual>=1,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.6,<9.7"]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
catfish-lab = "lab.cli:app"
lab = "lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.hatch.build.targets.sdist]
include = [
  "/lab",
  "/tests",
  "/docs",
  "/.github",
  "/.opencode",
  "/README.md",
  "/AGENTS.md",
  "/CAPABILITIES.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/compose.yaml",
  "/mkdocs.yml",
]
exclude = ["/.lab", "/archive", "/dist", "/site"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lab/config.py" = ["E501"]
